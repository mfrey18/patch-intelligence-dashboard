name: Production operations monitor

on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-operations-monitor
  cancel-in-progress: false

jobs:
  monitor:
    environment:
      name: production-ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_ORIGIN: ${{ vars.PUBLIC_API_BASE_URL }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture authenticated operational health
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          test -n "$API_ORIGIN" && test -n "$INGEST_SECRET" && test -n "$CLOUDFLARE_D1_DATABASE_NAME"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $INGEST_SECRET" "$API_ORIGIN/api/internal/monitor" > operations-monitor.json
          jq . operations-monitor.json
          jq -r '.alerts[] | "::warning title=\(.code)::\(.message)"' operations-monitor.json
      - name: Capture D1 capacity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          d1_info="$(pnpm exec wrangler d1 info "$CLOUDFLARE_D1_DATABASE_NAME" --json)"
          database_bytes="$(echo "$d1_info" | jq -er '.database_size | tonumber | select(. > 0)')"
          jq --argjson databaseBytes "$database_bytes" '. + {databaseBytes:$databaseBytes,databaseWarningBytes:400000000}' operations-monitor.json > operations-monitor-with-capacity.json
      - name: Archive operational health
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-operations-${{ github.run_id }}
          path: operations-monitor*.json
          retention-days: 30
      - name: Publish or resolve production alert
        if: always()
        uses: actions/github-script@v8
        env:
          MONITOR_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const title = '[Production] Patch intelligence operations alert';
            const path = fs.existsSync('operations-monitor-with-capacity.json') ? 'operations-monitor-with-capacity.json' : 'operations-monitor.json';
            let monitor = null;
            if (fs.existsSync(path)) monitor = JSON.parse(fs.readFileSync(path, 'utf8'));
            const alerts = monitor?.alerts ?? [{ severity: 'critical', code: 'monitor_unavailable', message: 'The production monitor did not produce a readable result.' }];
            if (monitor?.databaseBytes >= monitor?.databaseWarningBytes) alerts.push({ severity: 'critical', code: 'd1_capacity', message: `D1 is ${monitor.databaseBytes} bytes; warning threshold is ${monitor.databaseWarningBytes} bytes.` });
            if (process.env.MONITOR_JOB_STATUS !== 'success' && alerts.length === 0) alerts.push({ severity: 'critical', code: 'monitor_workflow_failed', message: 'The production monitoring workflow failed outside the runtime alert checks.' });
            const unhealthy = process.env.MONITOR_JOB_STATUS !== 'success' || monitor?.status !== 'healthy' || alerts.length > 0;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (unhealthy) {
              const body = [`Automated production monitoring requires attention.`, '', ...alerts.map((alert) => `- **${alert.severity.toUpperCase()} · ${alert.code}** — ${alert.message}`), '', `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, `Captured: ${monitor?.capturedAt ?? 'unavailable'}`].join('\n');
              if (existing) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
              else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['operations'] }).catch(async (error) => {
                if (error.status !== 422) throw error;
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
              });
            } else if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Resolved automatically by ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
            }
      - name: Enforce production health gate
        if: always()
        run: |
          test -f operations-monitor-with-capacity.json
          jq -e '.status != "unhealthy" and .projection.parityStatus == "passed" and .projection.actualCount > 0 and .dashboardCoreLatencyMs < 1000 and .databaseBytes < .databaseWarningBytes' operations-monitor-with-capacity.json
