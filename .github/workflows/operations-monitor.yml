name: Production operations monitor
on:
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-operations-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: vars.DATABASE_BACKEND == 'postgres'
    environment: production-ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:patch-ci
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Enforce production health gate
        env:
          PRIVATE_API_BASE_URL: ${{ vars.PRIVATE_API_BASE_URL }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          INGEST_SECRET: ${{ secrets.NATIVE_INGEST_SECRET }}
        run: node scripts/cutover-check.mjs
