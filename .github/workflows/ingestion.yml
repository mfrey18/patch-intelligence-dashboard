name: Patch intelligence ingestion

on:
  schedule:
    - cron: "17 7 * * *"
    - cron: "27 * * * *"
    - cron: "47 8 * * 2"
  workflow_dispatch:
    inputs:
      source:
        description: Source to run
        required: true
        type: choice
        options: [microsoft-msrc-csaf, cisco-psirt-csaf, cisa-kev, first-epss, palo-alto-psirt-csaf, ivanti-security-advisory-rss, mozilla-mfsa-yaml, oracle-cpu-csaf, atlassian-vulnerability-api, red-hat-csaf, vmware-broadcom-json, adobe-psirt-csaf, fortinet-psirt-csaf, apple-configured-csaf, sap-configured-csaf, citrix-configured-csaf, chrome-configured-csaf, cve-list-v5, nvd-cve, vulncheck-kev]
      mode:
        description: Ingestion mode
        required: true
        default: delta
        type: choice
        options: [delta, replay, backfill, patch_tuesday]
      since:
        description: ISO-8601 coverage start (required for replay)
        required: false
        type: string
      until:
        description: ISO-8601 coverage end (required for replay)
        required: false
        type: string
      checkpoint_id:
        description: Stable identifier for a resumed replay/backfill
        required: false
        type: string
      max_attempts:
        description: Bounded Worker invocations in this run (1-50)
        required: false
        default: "10"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ingestion-${{ github.event_name }}-${{ inputs.source || github.run_id }}
  cancel-in-progress: false

jobs:
  daily:
    if: github.event_name == 'schedule' && github.event.schedule == '17 7 * * *' && vars.ENABLE_SCHEDULED_INGESTION == 'true'
    environment: production-ingestion
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { source: cisa-kev, max_attempts: 1, batch_size: 12 }
          - { source: first-epss, max_attempts: 1, batch_size: 12 }
          # The live MSRC changes index can legitimately contain hundreds of
          # recently modified documents. Each attempt remains capped at 12
          # advisory fetches for Workers Free; the workflow resumes checkpoints.
          - { source: microsoft-msrc-csaf, max_attempts: 50, batch_size: 12 }
          # Cisco CSAF documents can individually contain tens of thousands of
          # relational assertions. Give each document its own Free invocation.
          - { source: cisco-psirt-csaf, max_attempts: 4, batch_size: 1 }
          - { source: palo-alto-psirt-csaf, max_attempts: 4, batch_size: 12 }
          - { source: mozilla-mfsa-yaml, max_attempts: 4, batch_size: 12 }
    name: Daily source — ${{ matrix.source }}
    steps:
      - uses: tailscale/github-action@v4
        if: vars.DATABASE_BACKEND == 'postgres'
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:patch-ci
      - name: Run isolated source delta
        env:
          API_ORIGIN: ${{ vars.DATABASE_BACKEND == 'postgres' && vars.PRIVATE_API_BASE_URL || vars.PUBLIC_API_BASE_URL }}
          INGEST_SECRET: ${{ secrets[vars.DATABASE_BACKEND == 'postgres' && 'NATIVE_INGEST_SECRET' || 'INGEST_SECRET'] }}
          SOURCE_ID: ${{ matrix.source }}
          MAX_ATTEMPTS: ${{ matrix.max_attempts }}
          BATCH_SIZE: ${{ matrix.batch_size }}
        run: |
          test -n "$API_ORIGIN" && test -n "$INGEST_SECRET"
          checkpoint="daily:${SOURCE_ID}:$(date -u +%Y-%m-%d)"
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            response="$(jq -n --arg source "$SOURCE_ID" --arg checkpoint "$checkpoint" --argjson batchSize "$BATCH_SIZE" '{sources:[$source],mode:"delta",checkpointId:$checkpoint,maxItems:$batchSize,refreshProjection:false}' |
              curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $INGEST_SECRET" -H "content-type: application/json" --data-binary @- "$API_ORIGIN/api/internal/ingest")"
            echo "$response" | jq .
            result_status="$(echo "$response" | jq -r '.results[0].status')"
            if [ "$result_status" = "failed" ] || [ "$result_status" = "skipped" ]; then exit 1; fi
            state="$(echo "$response" | jq -r '.results[0].checkpoint.status // "complete"')"
            if [ "$state" = "complete" ]; then exit 0; fi
          done
          echo "Source repeatedly reached the configured batch bound" >&2
          exit 1

  patch-tuesday:
    if: github.event_name == 'schedule' && github.event.schedule == '47 8 * * 2' && vars.ENABLE_SCHEDULED_INGESTION == 'true'
    environment: production-ingestion
    runs-on: ubuntu-latest
    steps:
      - uses: tailscale/github-action@v4
        if: vars.DATABASE_BACKEND == 'postgres'
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:patch-ci
      - name: Run only on the second Tuesday
        id: calendar
        run: |
          day="$(date -u +%d)"
          if [ "$day" -ge 8 ] && [ "$day" -le 14 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Reconcile Microsoft release day
        if: steps.calendar.outputs.run == 'true'
        env:
          API_ORIGIN: ${{ vars.DATABASE_BACKEND == 'postgres' && vars.PRIVATE_API_BASE_URL || vars.PUBLIC_API_BASE_URL }}
          INGEST_SECRET: ${{ secrets[vars.DATABASE_BACKEND == 'postgres' && 'NATIVE_INGEST_SECRET' || 'INGEST_SECRET'] }}
        run: |
          since="$(date -u +%Y-%m-%dT00:00:00.000Z)"
          until="$(date -u +%Y-%m-%dT23:59:59.999Z)"
          checkpoint="patch-tuesday:$(date -u +%Y-%m-%d)"
          for attempt in $(seq 1 25); do
            response="$(jq -n --arg since "$since" --arg until "$until" --arg checkpoint "$checkpoint" '{sources:["microsoft-msrc-csaf"],mode:"patch_tuesday",since:$since,until:$until,checkpointId:$checkpoint}' |
              curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $INGEST_SECRET" -H "content-type: application/json" --data-binary @- "$API_ORIGIN/api/internal/ingest")"
            echo "$response" | jq .
            if [ "$(echo "$response" | jq -r '.results[0].status')" = "failed" ]; then exit 1; fi
            state="$(echo "$response" | jq -r '.results[0].checkpoint.status // "complete"')"
            if [ "$state" = "complete" ]; then exit 0; fi
          done
          echo "Microsoft reconciliation repeatedly reached the configured batch bound" >&2
          exit 1

  manual:
    if: github.event_name == 'workflow_dispatch'
    environment: production-ingestion
    runs-on: ubuntu-latest
    steps:
      - uses: tailscale/github-action@v4
        if: vars.DATABASE_BACKEND == 'postgres'
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:patch-ci
      - name: Run one bounded source batch
        env:
          API_ORIGIN: ${{ vars.DATABASE_BACKEND == 'postgres' && vars.PRIVATE_API_BASE_URL || vars.PUBLIC_API_BASE_URL }}
          INGEST_SECRET: ${{ secrets[vars.DATABASE_BACKEND == 'postgres' && 'NATIVE_INGEST_SECRET' || 'INGEST_SECRET'] }}
          SOURCE_ID: ${{ inputs.source }}
          MODE: ${{ inputs.mode }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          CHECKPOINT_ID: ${{ inputs.checkpoint_id }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        run: |
          test -n "$API_ORIGIN" && test -n "$INGEST_SECRET"
          case "$MAX_ATTEMPTS" in ''|*[!0-9]*) echo "max_attempts must be an integer" >&2; exit 1;; esac
          test "$MAX_ATTEMPTS" -ge 1 && test "$MAX_ATTEMPTS" -le 50
          checkpoint="$CHECKPOINT_ID"
          if [ -z "$checkpoint" ] && [ "$MODE" = "backfill" ]; then checkpoint="backfill:${SOURCE_ID}:six-month"; fi
          if [ "$SOURCE_ID" = "cisco-psirt-csaf" ] || [ "$SOURCE_ID" = "oracle-cpu-csaf" ]; then batch_size=1; else batch_size=12; fi
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            response="$(jq -n --arg source "$SOURCE_ID" --arg mode "$MODE" --arg since "$SINCE" --arg until "$UNTIL" --arg checkpoint "$checkpoint" --argjson batchSize "$batch_size" '
              {sources:[$source],mode:$mode,maxItems:$batchSize}
              + (if $since == "" then {} else {since:$since} end)
              + (if $until == "" then {} else {until:$until} end)
              + (if $checkpoint == "" then {} else {checkpointId:$checkpoint} end)
            ' | curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $INGEST_SECRET" -H "content-type: application/json" --data-binary @- "$API_ORIGIN/api/internal/ingest")"
            echo "$response" | jq .
            result_status="$(echo "$response" | jq -r '.results[0].status')"
            if [ "$result_status" = "failed" ] || [ "$result_status" = "skipped" ]; then exit 1; fi
            state="$(echo "$response" | jq -r '.results[0].checkpoint.status // "complete"')"
            if [ "$state" = "complete" ]; then exit 0; fi
          done
          echo "Checkpoint remains resumable after $MAX_ATTEMPTS bounded Worker invocations."

  housekeeping:
    if: always() && github.event_name == 'schedule' && github.event.schedule == '17 7 * * *' && vars.ENABLE_SCHEDULED_INGESTION == 'true'
    needs: daily
    environment: production-ingestion
    runs-on: ubuntu-latest
    steps:
      - uses: tailscale/github-action@v4
        if: vars.DATABASE_BACKEND == 'postgres'
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:patch-ci
      - name: Publish one atomic dashboard projection
        env:
          API_ORIGIN: ${{ vars.DATABASE_BACKEND == 'postgres' && vars.PRIVATE_API_BASE_URL || vars.PUBLIC_API_BASE_URL }}
          INGEST_SECRET: ${{ secrets[vars.DATABASE_BACKEND == 'postgres' && 'NATIVE_INGEST_SECRET' || 'INGEST_SECRET'] }}
        run: |
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $INGEST_SECRET" "$API_ORIGIN/api/internal/projection" | jq -e '.status == "success" and .cveCount > 0'
      - name: Apply bounded retention and clear expired operational state
        env:
          API_ORIGIN: ${{ vars.DATABASE_BACKEND == 'postgres' && vars.PRIVATE_API_BASE_URL || vars.PUBLIC_API_BASE_URL }}
          INGEST_SECRET: ${{ secrets[vars.DATABASE_BACKEND == 'postgres' && 'NATIVE_INGEST_SECRET' || 'INGEST_SECRET'] }}
        run: |
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $INGEST_SECRET" "$API_ORIGIN/api/internal/retention" | jq .
      - name: Check projection parity, source freshness, bounds, latency, and leases
        env:
          API_ORIGIN: ${{ vars.DATABASE_BACKEND == 'postgres' && vars.PRIVATE_API_BASE_URL || vars.PUBLIC_API_BASE_URL }}
          INGEST_SECRET: ${{ secrets[vars.DATABASE_BACKEND == 'postgres' && 'NATIVE_INGEST_SECRET' || 'INGEST_SECRET'] }}
        run: |
          monitor="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $INGEST_SECRET" "$API_ORIGIN/api/internal/monitor")"
          echo "$monitor" | jq .
          echo "$monitor" | jq -r '.alerts[] | "::warning title=\(.code)::\(.message)"'
          echo "$monitor" | jq -e '.status != "unhealthy" and .projection.parityStatus == "passed" and .projection.actualCount > 0 and (.sources | length) >= 6'

  expansion:
    if: github.event_name == 'schedule' && github.event.schedule == '27 * * * *' && vars.ENABLE_SCHEDULED_INGESTION == 'true' && vars.DATABASE_BACKEND == 'postgres'
    environment: production-ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: expansion-ingestion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:patch-ci
      - name: Resume enabled expansion sources and enrichment queues
        env:
          API_ORIGIN: ${{ vars.PRIVATE_API_BASE_URL }}
          INGEST_SECRET: ${{ secrets.NATIVE_INGEST_SECRET }}
        run: node scripts/sync-expansion.mjs
