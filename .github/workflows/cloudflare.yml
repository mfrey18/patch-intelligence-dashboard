name: Validate and deploy Cloudflare API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: production-worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      PUBLIC_DASHBOARD_ORIGINS: ${{ vars.PUBLIC_DASHBOARD_ORIGINS }}
      PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require production bindings
        run: test -n "$CLOUDFLARE_D1_DATABASE_ID" && test -n "$CLOUDFLARE_D1_DATABASE_NAME" && test -n "$PUBLIC_DASHBOARD_ORIGINS" && test -n "$PUBLIC_API_BASE_URL"
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm run test:focused
      - run: pnpm run build
      - run: pnpm run test:rendered
      - name: Stage D1 migrations with the generated Worker config
        run: mkdir -p dist/server/migrations && cp migrations/*.sql dist/server/migrations/
      - name: Worker deployment dry-run
        run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.json
      - name: Confirm production D1 migration state
        run: pnpm exec wrangler d1 migrations list "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply backward-compatible D1 migrations
        run: pnpm exec wrangler d1 migrations apply "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and public assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: dist/server
          command: deploy --config wrangler.json
          secrets: |
            INGEST_SECRET
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
      - name: Populate dashboard read model
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          projection_file="$(mktemp)"
          projection_status=""
          for attempt in $(seq 1 12); do
            projection_status="$(curl --silent --show-error --output "$projection_file" --write-out '%{http_code}' -X POST -H "Authorization: Bearer $INGEST_SECRET" "$PUBLIC_API_BASE_URL/api/internal/projection")"
            if [ "$projection_status" = "200" ]; then break; fi
            if [ "$projection_status" != "404" ]; then cat "$projection_file"; exit 1; fi
            sleep 5
          done
          test "$projection_status" = "200"
          projection="$(cat "$projection_file")"
          echo "$projection" | jq .
          echo "$projection" | jq -e '.status == "success" and .version >= 1 and .cveCount > 0 and .parity.status == "passed"'
      - name: Smoke-test Worker and public API
        run: |
          dashboard="$(curl --fail --silent --show-error "$PUBLIC_API_BASE_URL/api/dashboard?limit=1")"
          echo "$dashboard" | jq -e '.metrics.total >= 0 and (.rows | type == "array") and (.priorityDistribution.P1 >= 0)'
          for query in 'vendor=microsoft' 'vendor=cisco' 'kev=true' 'priority=P1' 'patchAvailable=true'; do
            curl --fail --silent --show-error "$PUBLIC_API_BASE_URL/api/dashboard?limit=1&$query" | jq -e '.metrics.total >= 0 and (.rows | type == "array")' > /dev/null
          done
          for panel in activity emerging epss-movers vendor-threats cwe products patch-tuesday; do
            curl --fail --silent --show-error "$PUBLIC_API_BASE_URL/api/dashboard/analytics/$panel" | jq -e --arg panel "$panel" '.panel == $panel' > /dev/null
          done
          patch="$(curl --fail --silent --show-error "$PUBLIC_API_BASE_URL/api/dashboard/analytics/patch-tuesday")"
          echo "$patch" | jq -e '(.releaseEvents | type == "array") and ([.releaseEvents[] | select((.totalBasis == "vendor_reported" and .totalSourceUrl == null) or .linkedTotal < 0 or (.reconciliationStatus != "matched" and .reconciliationStatus != "partial" and .reconciliationStatus != "overlinked" and .reconciliationStatus != "unreported"))] | length == 0)'
          curl --fail --silent --show-error "$PUBLIC_API_BASE_URL/api/dashboard/export?format=json&limit=2" | jq -e '(.rows | type == "array") and (.rows | length <= 2)' > /dev/null
          csv_type="$(curl --fail --silent --show-error -D - -o /dev/null "$PUBLIC_API_BASE_URL/api/dashboard/export?format=csv&limit=2" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type" {print $2}')"
          test "$csv_type" = "text/csv; charset=utf-8"
      - name: Verify exact production CORS policy
        run: |
          allowed_origin="${PUBLIC_DASHBOARD_ORIGINS%%,*}"
          allowed="$(curl --fail --silent --show-error -H "Origin: $allowed_origin" -D - -o /dev/null "$PUBLIC_API_BASE_URL/api/dashboard?limit=1" | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin" {print $2}')"
          denied="$(curl --fail --silent --show-error -H 'Origin: https://not-authorized.invalid' -D - -o /dev/null "$PUBLIC_API_BASE_URL/api/dashboard?limit=1" | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin" {print $2}')"
          test "$allowed" = "$allowed_origin"
          test -z "$denied"
      - name: Verify protected ingestion rejects unauthenticated requests
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{"sources":["cisa-kev"]}' "$PUBLIC_API_BASE_URL/api/internal/ingest")"
          test "$status" = "401"
      - name: Validate one bounded Microsoft delta batch
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          response="$(jq -n --arg checkpoint "gate1:microsoft:${GITHUB_SHA}" '{sources:["microsoft-msrc-csaf"],mode:"delta",checkpointId:$checkpoint,maxItems:12}' |
            curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $INGEST_SECRET" -H 'content-type: application/json' --data-binary @- "$PUBLIC_API_BASE_URL/api/internal/ingest")"
          echo "$response" | jq .
          echo "$response" | jq -e '.status != "failed" and .results[0].sourceId == "microsoft-msrc-csaf" and (.results[0].processed // 0) <= 12 and (.results[0].counts.failed // 0) == 0 and (.results[0].checkpoint.status == "pending" or .results[0].checkpoint.status == "complete")'
      - name: Capture post-deploy D1 health and latency baseline
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          health_file="$(mktemp)"
          health_status="$(curl --silent --show-error --output "$health_file" --write-out '%{http_code}' -H "Authorization: Bearer $INGEST_SECRET" "$PUBLIC_API_BASE_URL/api/internal/health")"
          jq . "$health_file"
          test "$health_status" = "200"

          d1_info="$(pnpm exec wrangler d1 info "$CLOUDFLARE_D1_DATABASE_NAME" --json --config dist/server/wrangler.json)"
          database_bytes="$(echo "$d1_info" | jq -er '.database_size | tonumber | select(. > 0)')"
          jq --argjson databaseBytes "$database_bytes" '(.rowCounts | to_entries | map(.value) | add) as $observedRows | .databaseBytes=$databaseBytes | .databaseSizeSource="wrangler_d1_info" | .projections |= map(.estimatedBytes = (if $observedRows > 0 then ((.estimatedRows * $databaseBytes / $observedRows) | round) else null end))' "$health_file" > d1-production-baseline.json
          jq '{capturedAt,intelligenceWindowMonths,databaseBytes,databaseSizeSource,largestTables,epssHistory,queryLatencyMs,slowestImportantQuery,baselineMaturity}' d1-production-baseline.json
          jq -e '.intelligenceWindowMonths == 6 and .databaseBytes > 0 and .databaseSizeSource == "wrangler_d1_info" and .rowCounts.ingestion_leases == 0 and (.queryLatencyMs.dashboard_api_default | type == "number") and .queryLatencyMs.dashboard_api_default < 5000' d1-production-baseline.json
      - name: Archive D1 production baseline
        uses: actions/upload-artifact@v4
        with:
          name: d1-production-baseline-${{ github.sha }}
          path: d1-production-baseline.json
          retention-days: 30
      - name: Record deployed Worker versions for rollback
        run: pnpm exec wrangler deployments list --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
