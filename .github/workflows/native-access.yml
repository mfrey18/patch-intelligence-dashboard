name: Verify private native access

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    environment: production-native
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      PRIVATE_API_BASE_URL: ${{ vars.PRIVATE_API_BASE_URL }}
    steps:
      - name: Join as an ephemeral CI device
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:patch-ci

      - name: Verify allowed private services and denied database access
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress, json, os, re, socket, urllib.error, urllib.request

          host = os.environ['DEPLOY_HOST']
          origin = os.environ['PRIVATE_API_BASE_URL'].rstrip('/')
          secret = os.environ['INGEST_SECRET']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]+\.ts\.net', host):
              raise SystemExit('DEPLOY_HOST must be the native Tailscale hostname')
          if origin != 'https://' + host + ':8443' or len(secret) < 32:
              raise SystemExit('Private API origin or authentication configuration is invalid')
          endpoints = {(family, address) for family, _, _, _, address in socket.getaddrinfo(host, 5432, type=socket.SOCK_STREAM)}
          if not endpoints:
              raise SystemExit('The native host did not resolve')
          for _, address in endpoints:
              ip = ipaddress.ip_address(address[0])
              tailnet = ipaddress.ip_network('100.64.0.0/10') if ip.version == 4 else ipaddress.ip_network('fd7a:115c:a1e0::/48')
              if ip not in tailnet:
                  raise SystemExit('Host did not resolve privately; database-denial test would be inconclusive')
          for port in (22, 8443):
              with socket.create_connection((host, port), timeout=8):
                  pass

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  return None

          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          request = urllib.request.Request(origin + '/api/internal/health', headers={'Authorization': 'Bearer ' + secret})
          try:
              with opener.open(request, timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit('Private health did not return HTTP 200')
                  body = response.read(1024 * 1024 + 1)
              if len(body) > 1024 * 1024 or json.loads(body).get('databaseEngine') != 'postgresql':
                  raise SystemExit('Private health did not identify PostgreSQL')
          except urllib.error.HTTPError as error:
              raise SystemExit('Private health returned HTTP ' + str(error.code)) from None
          except (urllib.error.URLError, TimeoutError, ValueError):
              raise SystemExit('Private health request failed; response contents were not logged') from None

          for family, address in endpoints:
              with socket.socket(family, socket.SOCK_STREAM) as connection:
                  connection.settimeout(5)
                  try:
                      connection.connect(address)
                  except TimeoutError:
                      continue
                  except OSError:
                      raise SystemExit('Database denial is inconclusive: expected timeout, received another network error') from None
                  raise SystemExit('CI could connect to PostgreSQL; tailnet policy verification failed')
          print('Verified private TCP 22/8443, authenticated PostgreSQL health, and TCP 5432 timeouts on every resolved tailnet address.')
          PY

      - name: Verify restricted SSH key and temporary SFTP upload
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+\.ts\.net$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]+$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          identity_dir=$(mktemp -d "$RUNNER_TEMP/native-access.XXXXXX")
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$identity_dir/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$identity_dir/known_hosts"
          ssh_options=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$identity_dir/known_hosts" -o ConnectTimeout=8
            -o ConnectionAttempts=1 -o ServerAliveInterval=5 -o ServerAliveCountMax=2
            -i "$identity_dir/id_ed25519")
          destination="$DEPLOY_USER@$DEPLOY_HOST"
          remote_file="/Library/PatchIntelligence/incoming/.native-access-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          uploaded=false
          cleanup() {
            if [ "$uploaded" = true ]; then
              printf 'rm "%s"\n' "$remote_file" |
                timeout 20s sftp "${ssh_options[@]}" -b - "$destination" >/dev/null 2>&1 || true
            fi
            rm -rf "$identity_dir"
          }
          trap cleanup EXIT
          status=0
          timeout 20s ssh "${ssh_options[@]}" "$destination" /usr/bin/true > "$identity_dir/ssh-check.log" 2>&1 || status=$?
          if [ "$status" -ne 126 ]; then
            printf 'Expected forced-command rejection 126, received %s.\n' "$status" >&2
            exit 1
          fi
          printf 'Native access verification %s/%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$identity_dir/probe.txt"
          uploaded=true
          printf 'put "%s" "%s"\nget "%s" "%s"\nrm "%s"\n' \
            "$identity_dir/probe.txt" "$remote_file" "$remote_file" "$identity_dir/roundtrip.txt" "$remote_file" |
            timeout 25s sftp "${ssh_options[@]}" -b - "$destination" >/dev/null
          uploaded=false
          cmp "$identity_dir/probe.txt" "$identity_dir/roundtrip.txt"
          printf '%s\n' 'Verified pinned SSH identity, shell-command rejection, and SFTP upload/download/deletion. No release was deployed.'
