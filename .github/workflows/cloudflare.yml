name: Validate and deploy Cloudflare API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: production-worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      PUBLIC_DASHBOARD_ORIGINS: ${{ vars.PUBLIC_DASHBOARD_ORIGINS }}
      PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require production bindings
        run: test -n "$CLOUDFLARE_D1_DATABASE_ID" && test -n "$CLOUDFLARE_D1_DATABASE_NAME" && test -n "$PUBLIC_DASHBOARD_ORIGINS" && test -n "$PUBLIC_API_BASE_URL"
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm run test:focused
      - run: pnpm run build
      - run: pnpm run test:rendered
      - name: Stage D1 migrations with the generated Worker config
        run: mkdir -p dist/server/migrations && cp migrations/*.sql dist/server/migrations/
      - name: Worker deployment dry-run
        run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.json
      - name: Confirm production D1 migration state
        run: pnpm exec wrangler d1 migrations list "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply backward-compatible D1 migrations
        run: pnpm exec wrangler d1 migrations apply "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and public assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy --config dist/server/wrangler.json
          secrets: |
            INGEST_SECRET
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
      - name: Smoke-test Worker and public API
        run: |
          dashboard="$(curl --fail --silent --show-error "$PUBLIC_API_BASE_URL/api/dashboard?limit=1")"
          echo "$dashboard" | jq -e '.metrics.total >= 0 and (.rows | type == "array") and (.priorityDistribution.P1 >= 0)'
          for query in 'vendor=microsoft' 'vendor=cisco' 'kev=true' 'priority=P1' 'patchAvailable=true'; do
            curl --fail --silent --show-error "$PUBLIC_API_BASE_URL/api/dashboard?limit=1&$query" | jq -e '.metrics.total >= 0 and (.rows | type == "array")' > /dev/null
          done
      - name: Verify exact production CORS policy
        run: |
          allowed_origin="${PUBLIC_DASHBOARD_ORIGINS%%,*}"
          allowed="$(curl --fail --silent --show-error -H "Origin: $allowed_origin" -D - -o /dev/null "$PUBLIC_API_BASE_URL/api/dashboard?limit=1" | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin" {print $2}')"
          denied="$(curl --fail --silent --show-error -H 'Origin: https://not-authorized.invalid' -D - -o /dev/null "$PUBLIC_API_BASE_URL/api/dashboard?limit=1" | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin" {print $2}')"
          test "$allowed" = "$allowed_origin"
          test -z "$denied"
      - name: Verify protected ingestion rejects unauthenticated requests
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{"sources":["cisa-kev"]}' "$PUBLIC_API_BASE_URL/api/internal/ingest")"
          test "$status" = "401"
      - name: Validate one bounded Microsoft delta batch
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          response="$(jq -n --arg checkpoint "gate1:microsoft:${GITHUB_SHA}" '{sources:["microsoft-msrc-csaf"],mode:"delta",checkpointId:$checkpoint,maxItems:12}' |
            curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $INGEST_SECRET" -H 'content-type: application/json' --data-binary @- "$PUBLIC_API_BASE_URL/api/internal/ingest")"
          echo "$response" | jq .
          echo "$response" | jq -e '.status != "failed" and .results[0].sourceId == "microsoft-msrc-csaf" and (.results[0].processed // 0) <= 12 and (.results[0].counts.failed // 0) == 0 and (.results[0].checkpoint.status == "pending" or .results[0].checkpoint.status == "complete")'
      - name: Capture post-deploy D1 health and latency baseline
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          health="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $INGEST_SECRET" "$PUBLIC_API_BASE_URL/api/internal/health")"
          echo "$health" | jq '{capturedAt,intelligenceWindowMonths,databaseBytes,largestTables,epssHistory,queryLatencyMs,slowestImportantQuery,baselineMaturity}'
          echo "$health" | jq -e '.intelligenceWindowMonths == 6 and .databaseBytes > 0 and .rowCounts.ingestion_leases == 0 and (.queryLatencyMs.dashboard_api_default | type == "number") and .queryLatencyMs.dashboard_api_default < 5000'
      - name: Record deployed Worker versions for rollback
        run: pnpm exec wrangler deployments list --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
