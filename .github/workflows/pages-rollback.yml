name: Prepare or restore a pinned Pages rollback

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare a retained artifact without publishing, or restore that artifact
        required: true
        default: prepare
        type: choice
        options: [prepare, restore]
      source_sha:
        description: Full commit SHA of the previously successful Pages release
        required: true
        type: string
      source_run_id:
        description: Original successful Pages run for prepare; successful preparation run for restore
        required: true
        type: string
      legacy_api_origin:
        description: Exact saved public Worker API origin (prepare only)
        required: false
        type: string
      artifact_id:
        description: Pinned retained artifact ID from preparation (restore only)
        required: false
        type: string
      artifact_tar_sha256:
        description: Pinned artifact.tar SHA-256 from preparation (restore only)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: read
      actions: read
      pages: read
    if: github.ref == 'refs/heads/main' && inputs.mode == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Verify the pinned source was successfully deployed from this repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          LEGACY_API_ORIGIN: ${{ inputs.legacy_api_origin }}
        run: node scripts/pages-release-guard.mjs legacy
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: legacy
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: legacy/pnpm-lock.yaml
      - name: Read the existing Pages base path
        id: pages
        uses: actions/configure-pages@v5
      - name: Rebuild and verify the pinned static release without deploying
        working-directory: legacy
        env:
          VITE_API_BASE_URL: ${{ inputs.legacy_api_origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          pnpm install --frozen-lockfile
          pnpm pages:build
          pnpm test:pages
      - uses: actions/upload-pages-artifact@v4
        id: archive
        with:
          name: pages-rollback-${{ inputs.source_sha }}
          path: legacy/dist-pages
          retention-days: 30
      - name: Record the immutable restore inputs
        env:
          ARTIFACT_ID: ${{ steps.archive.outputs.artifact_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          tar_digest=$(sha256sum "$RUNNER_TEMP/artifact.tar" | cut -d ' ' -f 1)
          {
            echo 'Prepared rollback artifact; no Pages deployment occurred.'
            printf '\nsource_sha: %s\n' "$SOURCE_SHA"
            printf '\nsource_run_id: %s\n' "$GITHUB_RUN_ID"
            printf '\nartifact_id: %s\n' "$ARTIFACT_ID"
            printf '\nartifact_tar_sha256: %s\n' "$tar_digest"
            echo 'Retain these exact inputs and download the artifact before its 30-day expiration.'
          } >> "$GITHUB_STEP_SUMMARY"

  stage-restore:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'restore'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify artifact identity and its successful preparation run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ROLLBACK_ARTIFACT_ID: ${{ inputs.artifact_id }}
          ROLLBACK_TAR_SHA256: ${{ inputs.artifact_tar_sha256 }}
        run: node scripts/pages-release-guard.mjs artifact
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: rollback
          merge-multiple: true
      - name: Require the exact retained Pages archive
        env:
          ROLLBACK_TAR_SHA256: ${{ inputs.artifact_tar_sha256 }}
        run: |
          test -f rollback/artifact.tar && test ! -L rollback/artifact.tar
          printf '%s  rollback/artifact.tar\n' "$ROLLBACK_TAR_SHA256" | sha256sum --check --strict
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages-rollback
          path: rollback/artifact.tar
          if-no-files-found: error
          retention-days: 30

  restore:
    needs: stage-restore
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore the verified retained Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-rollback
      - name: Smoke-test the restored page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: curl --fail --silent --show-error --max-time 30 "$PAGE_URL" | grep -q 'Vulnerability Intelligence'
