name: Deploy static dashboard to GitHub Pages

on:
  workflow_run:
    workflows: ["Validate and deploy Cloudflare API"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint app static-dashboard lib tests --max-warnings=0
      - name: Require the public API origin
        env:
          VITE_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: test -n "$VITE_API_BASE_URL"
      - name: Build static dashboard
        env:
          VITE_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm run pages:build
      - name: Verify static artifact
        env:
          VITE_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm run test:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test deployed repository page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$PAGE_URL" | grep -q 'Patch Intelligence'; then exit 0; fi
            sleep 5
          done
          exit 1
