name: Deploy static dashboard to GitHub Pages

on:
  workflow_run:
    workflows: ["Validate and deploy native API"]
    types: [completed]
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful native deployment run for this exact main commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      actions: read
      pages: read
    if: vars.DATABASE_BACKEND == 'postgres' && vars.ENABLE_NATIVE_DEPLOYMENT == 'true' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require successful native deployment of the selected Pages commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.native_run_id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/pages-release-guard.mjs native
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint app static-dashboard lib tests --max-warnings=0
      - name: Require the public API origin
        env:
          VITE_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: test -n "$VITE_API_BASE_URL"
      - name: Build static dashboard
        env:
          VITE_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm run pages:build
      - name: Verify static artifact
        env:
          VITE_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm run test:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
          retention-days: 30

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test deployed repository page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for _attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$PAGE_URL" | grep -q 'Vulnerability Intelligence'; then exit 0; fi
            sleep 5
          done
          exit 1
